<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3038"/>
      <stop offset="1" stop-color="#3A414C"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#FBEFB0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FBEFB0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FBEFB0" flood-opacity=".55"/>
    </filter>
    <style>
      .w { font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', 'Segoe UI', Arial, sans-serif;
           font-weight: 800; font-size: 50px; fill: #FBEFB0; }
      .pop { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%;
             animation: pop 6s cubic-bezier(.3,1.6,.5,1) infinite both; }
      .hop { transform-box: fill-box; transform-origin: 50% 100%;
             animation: hop .6s ease-in-out infinite alternate; }
      .p1 { animation-delay: 0s; }   .h1 { animation-delay: 0s; }
      .p2 { animation-delay: .55s; } .h2 { animation-delay: .15s; }
      .p3 { animation-delay: 1.1s; } .h3 { animation-delay: .3s; }
      .p4 { animation-delay: 1.5s; } .h4 { animation-delay: .45s; }
      @keyframes pop {
        0%   { opacity: 0; transform: translateY(24px) scale(.3) rotate(-8deg); }
        7%   { opacity: 1; transform: translateY(-8px) scale(1.2) rotate(4deg); }
        12%  { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
        72%  { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
        80%  { opacity: 0; transform: translateY(-14px) scale(.9) rotate(0); }
        100% { opacity: 0; transform: translateY(-14px) scale(.9) rotate(0); }
      }
      @keyframes hop {
        from { transform: translateY(0) rotate(-2deg); }
        to   { transform: translateY(-5px) rotate(2deg); }
      }
      .s { fill: #FBEFB0; animation: tw 2.4s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .1; } 50% { opacity: .9; } }
      @media (prefers-reduced-motion: reduce) {
        .pop, .hop, .s { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="800" height="160" rx="18" fill="url(#bg)"/>
  <rect width="800" height="160" rx="18" fill="url(#glow)"/>

  <!-- twinkles -->
  <path class="s" style="animation-delay:.2s" d="M60 34l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
  <path class="s" style="animation-delay:1.1s" d="M742 40l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/>
  <path class="s" style="animation-delay:.7s" d="M712 122l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
  <path class="s" style="animation-delay:1.6s" d="M96 120l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
  <circle class="s" style="animation-delay:.4s" cx="160" cy="28" r="1.6"/>
  <circle class="s" style="animation-delay:1.3s" cx="400" cy="22" r="1.4"/>
  <circle class="s" style="animation-delay:.9s" cx="620" cy="30" r="1.6"/>
  <circle class="s" style="animation-delay:1.9s" cx="300" cy="138" r="1.4"/>
  <circle class="s" style="animation-delay:.1s" cx="520" cy="136" r="1.6"/>

  <g filter="url(#soft)">
    <g class="pop p1"><text class="w hop h1" x="189" y="98" text-anchor="middle" textLength="230" lengthAdjust="spacingAndGlyphs">Ulalalala!!</text></g>
    <g class="pop p2"><text class="w hop h2" x="410" y="98" text-anchor="middle" textLength="140" lengthAdjust="spacingAndGlyphs">Yaha!!</text></g>
    <g class="pop p3"><text class="w hop h3" x="561" y="98" text-anchor="middle" textLength="90" lengthAdjust="spacingAndGlyphs">Ula!</text></g>
    <g class="pop p4"><text class="w hop h4" x="685" y="98" text-anchor="middle" textLength="84" lengthAdjust="spacingAndGlyphs">U-!!</text></g>
  </g>
</svg>
